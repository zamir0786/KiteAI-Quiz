<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kite AI QuizMaster</title>
  <style>
    body {
      font-family: "Inter", sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    }

    .container {
      background: white;
      padding: 2.5rem;
      border-radius: 1rem;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      max-width: 600px;
      width: 90%;
    }

    h1 {
      font-size: 1.8rem;
      color: #6a11cb;
      margin-bottom: 0.5rem;
    }

    p {
      color: #555;
      font-size: 1rem;
      margin-bottom: 1.5rem;
    }

    button {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      opacity: 0.9;
    }

    .quiz-container {
      display: none;
    }

    .option {
      background: #f7f7f7;
      border: 1px solid #ddd;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px 0;
      transition: 0.2s;
    }

    .option:hover {
      background: #eceaff;
      border-color: #6a11cb;
    }

    .correct {
      background-color: #c8e6c9;
      border-color: #2e7d32;
    }

    .wrong {
      background-color: #ffcdd2;
      border-color: #c62828;
    }
  </style>
</head>
<body>
  <div class="container start-container">
    <h1>🪁 Kite AI QuizMaster</h1>
    <p>Test Your Agentic Internet Knowledge</p>
    <p>
      How well do you understand the future of AI-native payments, trust, and
      governance? Take this quiz and find out!
    </p>
    <button id="start-btn">Start Quiz</button>
  </div>

  <div class="container quiz-container">
    <h2 id="question">Question text</h2>
    <div id="options"></div>
    <button id="next-btn" style="display: none;">Next</button>
  </div>

  <div class="container result-container" style="display: none;">
    <h2>Quiz Completed! 🎉</h2>
    <p id="score"></p>
    <button id="restart-btn">Restart</button>
  </div>

  <script>
    const quizData = [
      {
        question: "What is Kite AI's primary focus as a blockchain platform?",
        options: [
          "General-purpose DeFi lending protocols",
          "Enabling AI agents with identity, trust, and scalable payments for the agentic internet",
          "High-frequency trading for human users only",
          "Centralized AI model hosting"
        ],
        correct: 2
      },
      {
        question: "Which consensus mechanism does Kite AI use?",
        options: [
          "Proof of Stake (PoS)",
          "Proof of Work (PoW)",
          "Proof of Attributed Intelligence (PoAI)",
          "Delegated Proof of Authority (DPoA)"
        ],
        correct: 3
      },
      {
        question: "Kite AI is built on which blockchain ecosystem?",
        options: ["Avalanche", "Ethereum", "Solana", "Polkadot"],
        correct: 1
      },
      {
        question: "What type of transactions will AI agents handle on Kite AI?",
        options: [
          "Real-time autonomous transactions",
          "Batch-only payments",
          "Manual user-verified transfers",
          "Non-financial metadata transfers"
        ],
        correct: 1
      },
      {
        question: "What does 'Agentic Internet' mean in Kite AI's vision?",
        options: [
          "An internet run entirely by humans",
          "AI agents with autonomy, trust, and programmable payments",
          "Web2 infrastructure for AI tools",
          "Internet with no governance"
        ],
        correct: 2
      }
    ];

    const startBtn = document.getElementById("start-btn");
    const quizContainer = document.querySelector(".quiz-container");
    const startContainer = document.querySelector(".start-container");
    const resultContainer = document.querySelector(".result-container");
    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const scoreEl = document.getElementById("score");
    const restartBtn = document.getElementById("restart-btn");

    let currentQuestion = 0;
    let score = 0;

    startBtn.addEventListener("click", startQuiz);

    function startQuiz() {
      startContainer.style.display = "none";
      quizContainer.style.display = "block";
      loadQuestion();
    }

    function loadQuestion() {
      const question = quizData[currentQuestion];
      questionEl.textContent = question.question;
      optionsEl.innerHTML = "";

      question.options.forEach((option, i) => {
        const div = document.createElement("div");
        div.classList.add("option");
        div.textContent = option;
        div.addEventListener("click", () => selectOption(i));
        optionsEl.appendChild(div);
      });
      nextBtn.style.display = "none";
    }

    function selectOption(i) {
      const question = quizData[currentQuestion];
      const options = document.querySelectorAll(".option");

      options.forEach(opt => opt.style.pointerEvents = "none");

      // ✅ Adjusted here: +1 to match your 1-based index
      if (i + 1 === question.correct) {
        options[i].classList.add("correct");
        score++;
      } else {
        options[i].classList.add("wrong");
        options[question.correct - 1].classList.add("correct");
      }

      nextBtn.style.display = "inline-block";
    }

    nextBtn.addEventListener("click", nextQuestion);

    function nextQuestion() {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
      quizContainer.style.display = "none";
      resultContainer.style.display = "block";
      scoreEl.textContent = `Your Score: ${score} / ${quizData.length}`;
    }

    restartBtn.addEventListener("click", () => {
      currentQuestion = 0;
      score = 0;
      resultContainer.style.display = "none";
      startContainer.style.display = "block";
    });
  </script>
</body>
</html>
