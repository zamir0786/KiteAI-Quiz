<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kite AI Quiz</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: radial-gradient(circle at top left, #0a0a0a, #1a1a1a);
      color: #f5f5f5;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      color: #ffcc00;
      margin-bottom: 20px;
    }
    .quiz-container {
      background: #121212;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 600px;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    }
    .question {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background: #222;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 10px;
      font-size: 1rem;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background: #ffcc00;
      color: #000;
    }
    #next-btn {
      margin-top: 20px;
      display: none;
      background: #ffcc00;
      color: #000;
      font-weight: bold;
    }
    #result {
      font-size: 1.3rem;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🎯 Kite AI Quiz</h1>
  <div class="quiz-container">
    <div id="quiz">
      <div class="question" id="question"></div>
      <div class="options" id="options"></div>
      <button id="next-btn">Next</button>
      <div id="result"></div>
    </div>
  </div>

  <script>
    const quizData = [
      {
        question: "What is Kite AI's primary focus as a blockchain platform?",
        options: [
          "General-purpose DeFi lending protocols",
          "Enabling AI agents with identity, trust, and scalable payments for the agentic internet",
          "High-frequency trading for human users only",
          "Centralized AI model hosting"
        ],
        correct: 1
      },
      {
        question: "Which consensus mechanism does Kite AI use?",
        options: [
          "Proof of Stake (PoS)",
          "Proof of Work (PoW)",
          "Proof of Attributed Intelligence (PoAI)",
          "Delegated Proof of Authority (DPoA)"
        ],
        correct: 2
      },
      {
        question: "What is Kite AI’s main blockchain network?",
        options: ["Ethereum", "Avalanche", "Polygon", "Solana"],
        correct: 1
      },
      {
        question: "What does Kite AI aim to enable for AI agents?",
        options: [
          "Trading NFTs automatically",
          "Performing real-time payments, identity, and governance",
          "Generating AI art",
          "Hosting centralized cloud services"
        ],
        correct: 1
      },
      {
        question: "In Kite AI’s ecosystem, who can transact autonomously?",
        options: ["Only humans", "AI agents", "Validators only", "Developers only"],
        correct: 1
      },
      {
        question: "What kind of internet does Kite AI want to power?",
        options: [
          "The metaverse-only web",
          "The agentic internet where AI interacts and transacts autonomously",
          "Traditional finance-based internet",
          "A Web2.5 hybrid cloud"
        ],
        correct: 1
      },
      {
        question: "Which blockchain is Kite AI built on?",
        options: ["Avalanche", "Ethereum", "Cosmos", "Cardano"],
        correct: 0
      },
      {
        question: "What problem is Kite AI solving?",
        options: [
          "AI model storage only",
          "Decentralized identity and trust for autonomous agents",
          "GameFi tokenomics",
          "NFT price prediction"
        ],
        correct: 1
      },
      {
        question: "What type of payments is Kite AI focused on?",
        options: [
          "Micro and autonomous payments for AI agents",
          "Cross-chain swaps for DeFi protocols",
          "Retail credit transactions",
          "Gaming token transactions"
        ],
        correct: 0
      },
      {
        question: "What makes Kite AI unique in Web3?",
        options: [
          "It’s a meme coin project",
          "It merges AI autonomy with blockchain trust for real-time operations",
          "It provides only staking solutions",
          "It runs a centralized AI marketplace"
        ],
        correct: 1
      }
    ];

    let currentQuestion = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");
    const resultEl = document.getElementById("result");

    function loadQuestion() {
      const q = quizData[currentQuestion];
      questionEl.textContent = q.question;
      optionsEl.innerHTML = "";
      q.options.forEach((opt, i) => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.onclick = () => selectOption(i);
        optionsEl.appendChild(btn);
      });
      nextBtn.style.display = "none";
    }

    function selectOption(i) {
      const q = quizData[currentQuestion];
      const buttons = document.querySelectorAll("#options button");
      buttons.forEach((btn, index) => {
        btn.disabled = true;
        if (index === q.correct) btn.style.background = "#4CAF50";
        else if (index === i) btn.style.background = "#E74C3C";
      });
      if (i === q.correct) score++;
      nextBtn.style.display = "block";
    }

    nextBtn.onclick = () => {
      currentQuestion++;
      if (currentQuestion < quizData.length) {
        loadQuestion();
      } else {
        showResult();
      }
    };

    function showResult() {
      questionEl.textContent = "Quiz Completed! 🎉";
      optionsEl.innerHTML = "";
      nextBtn.style.display = "none";
      resultEl.textContent = `Your Score: ${score} / ${quizData.length}`;
    }

    loadQuestion();
  </script>
</body>
</html>
